<div class="container-fluid vh-100 d-flex flex-column p-0">
    <div class="bg-success text-center py-2 border-bottom border-dark">IT 05-3</div>

    <div class="flex-grow-1 d-flex flex-column align-items-center justify-content-center text-center gap-3">
      <button type="button" class="btn btn-primary px-5" [disabled]="loading()" (click)="clear()">ล้างคิว</button>
      @if (error()) {
        <div class="alert alert-danger" role="alert">{{ error() }}</div>
      }
      <h4>หมายเลขคิวปัจจุบัน</h4>
      <div class="display-1 fw-bold" style="font-size:8rem">{{ item()?.queueNumber }}</div>
      <button type="button" class="btn btn-primary px-5" (click)="back()">กลับไปหน้ารับบัตรคิว</button>
    </div>
  </div>
